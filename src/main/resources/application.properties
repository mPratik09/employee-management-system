FIND_BY_EMAILID=select * from users where email = 

FETCH_PENDING_USERS=select edr.id, edr.emp_id, u.first_name, u.last_name, u.email, edr.depart_id, d.department, u.status from emp_depart_requests edr join users u on u.id = edr.emp_id join departments d on d.id = edr.depart_id order by id asc;

