GET_REQUEST_FOR_ROLE=select depart_code from departments where depart_code = ?;

CHANGE_STATUS_TO_PENDING=update users set status = 'PENDING' where id = ?;

CHANGE_STATUS_TO_APPROVED=update users set status = 'APPROVED' where id = ?;
#CHANGE_STATUS=UPDATE users SET status = 'PENDING' WHERE id = ? AND EXISTS (SELECT 1 FROM departments WHERE depart_code = ?);

#FETCH_LINKED_DEPARTMENT=select d.department from departments d join emp_depart ed on d.id = ed.depart_id join users u on ed.emp_id = u.id where u.id = ?;
FETCH_LINKED_DEPARTMENT=select d.department from departments d join emp_depart ed on d.id = ed.depart_id join users u on ed.emp_id = u.id where ed.emp_id = ?;

FETCH_LANDING_PAGE=select d.landing_page, d.allowed_view from departments d join emp_depart ed on d.id = ed.depart_id join users u on ed.emp_id = u.id where u.id = ?;

EMPLOYEES_LIST_FOR_HR=select distinct u.* from users u join emp_depart ed on u.id = ed.emp_id join departments d on d.id = ed.depart_id where u.`status` = 'APPROVED' AND (d.depart_code = "SPRT_02" or d.depart_code = "HR_03" or d.depart_code = "IT_04" or d.depart_code = "FIN_05");

DEPARTMENT_REQUEST=insert into emp_depart_requests (emp_id, depart_id) values (?, ?);

DEPARTMENT_REQUEST_APPROVE=insert into emp_depart (emp_id, depart_id) values (?, ?);

DELETE_ENTRY_FOR_DEPARTMENT_REQUEST=delete from emp_depart_requests where emp_id = ? and depart_id = ?;

SAVE_UPDATED_EMPLOYEE=update users set first_name = ?, last_name = ?, email = ?, contact_num = ? where id = ?;